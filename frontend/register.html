<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Language LMS</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="app">
        <main class="main">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-logo">
                        <span class="logo-icon">🌐</span>
                        <span class="logo-text">Лангуаге</span>
                    </div>
                    <h1>Регистрация</h1>
                    <p class="auth-subtitle">Создайте аккаунт, чтобы начать учиться</p>

                    <form id="registerForm" class="auth-form">
                        <div class="form-group">
                            <label for="fullName">Полное имя</label>
                            <input
                                type="text"
                                id="fullName"
                                class="form-input"
                                placeholder="Иванов Иван Иванович"
                                autocomplete="name"
                            >
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input
                                type="email"
                                id="email"
                                class="form-input"
                                placeholder="you@example.com"
                                required
                                autocomplete="email"
                            >
                        </div>
                        <div class="form-group">
                            <label for="password">Пароль</label>
                            <input
                                type="password"
                                id="password"
                                class="form-input"
                                placeholder="Минимум 6 символов"
                                required
                                minlength="6"
                                autocomplete="new-password"
                            >
                        </div>
                        <div class="form-group">
                            <label for="role">Роль</label>
                            <select id="role" class="form-input">
                                <option value="student" selected>Студент</option>
                                <option value="teacher">Преподаватель</option>
                            </select>
                            <p class="form-hint">
                                Преподаватель может создавать курсы, уроки и тесты.
                            </p>
                        </div>

                        <div id="errorBox" class="auth-error" hidden></div>

                        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                            Зарегистрироваться
                        </button>
                    </form>

                    <p class="auth-switch">
                        Уже есть аккаунт? <a href="login.html">Войти</a>
                    </p>

                    <p class="auth-switch">
                        <a href="index.html">← На главную</a>
                    </p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
