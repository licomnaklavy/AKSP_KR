<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Language LMS</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="app">
        <main class="main">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-logo">
                        <span class="logo-icon">🌐</span>
                        <span class="logo-text">Лангуаге</span>
                    </div>
                    <h1>Вход</h1>
                    <p class="auth-subtitle">Войдите, чтобы продолжить обучение</p>

                    <form id="loginForm" class="auth-form">
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input
                                type="email"
                                id="email"
                                class="form-input"
                                placeholder="you@example.com"
                                required
                                autocomplete="email"
                            >
                        </div>
                        <div class="form-group">
                            <label for="password">Пароль</label>
                            <input
                                type="password"
                                id="password"
                                class="form-input"
                                placeholder="••••••"
                                required
                                autocomplete="current-password"
                            >
                        </div>

                        <div id="errorBox" class="auth-error" hidden></div>

                        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                            Войти
                        </button>
                    </form>

                    <p class="auth-switch">
                        Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
                    </p>

                    <p class="auth-switch">
                        <a href="index.html">← На главную</a>
                    </p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
